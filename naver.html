<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발주 수취인 정리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: 입력 패널(왼쪽)과 결과 패널(오른쪽)의 2단. 좁은 화면에서는 위아래로 쌓음. */
  :root {
    --bg: #f2f5f3;
    --surface: #ffffff;
    --ink: #1b2321;
    --muted: #5b6965;
    --line: #d8dfdb;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --soft: #e7efec;
    --err: #b3261e;
    --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111715; --surface: #192220; --ink: #e5ece9; --muted: #9aa8a3;
      --line: #2b3733; --accent: #5fc2a6; --accent-ink: #08201a; --soft: #22302c; --err: #ff8f86;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111715; --surface: #192220; --ink: #e5ece9; --muted: #9aa8a3;
    --line: #2b3733; --accent: #5fc2a6; --accent-ink: #08201a; --soft: #22302c; --err: #ff8f86;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding-block: 32px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .nav a { display: inline-block; padding: 8px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 500; }
  .nav a:hover { background: var(--soft); }
  .nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 4px; font-weight: 700; text-wrap: balance; }
  .lead { margin: 0 0 24px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; min-width: 0; }
  .panel + .panel { margin: 0; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-top: 18px; }
  .field:first-child { margin-top: 0; }
  label.lbl, .lbl { font-size: 0.8125rem; font-weight: 500; color: var(--muted); }

  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    min-height: 112px; padding: 16px; text-align: center; cursor: pointer;
    border: 1.5px dashed var(--line); border-radius: 8px; background: var(--bg);
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--soft); }
  .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .drop .name { font-weight: 500; overflow-wrap: anywhere; }
  .drop .hint { font-size: 0.8125rem; color: var(--muted); }

  input[type="password"], input[type="text"], select {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; width: 100%;
  }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  button {
    font: inherit; font-weight: 500; cursor: pointer; border-radius: 6px; padding: 10px 14px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--accent); }
  button.ghost:hover:not(:disabled) { background: var(--soft); }
  .run { width: 100%; margin-top: 20px; }

  .status { min-height: 1.6em; margin: 12px 0 0; font-size: 0.875rem; color: var(--muted); }
  .status.err { color: var(--err); font-weight: 500; }

  .res-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .summary b { color: var(--ink); font-weight: 700; }
  .tag { font-size: 0.75rem; font-weight: 500; padding: 2px 8px; border-radius: 4px; background: var(--soft); color: var(--accent); }
  pre#out {
    margin: 0; padding: 16px; max-height: 620px; overflow: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    font: inherit; font-size: 0.9375rem; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text;
  }
  pre#out.sample { color: var(--muted); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { background: transparent; color: var(--muted); border-color: var(--line); padding: 8px 14px; }
  .tab:hover { background: var(--soft); }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
</style>
</head>
<body>


<div class="wrap">
  <nav class="nav" aria-label="페이지 이동">
    <a href="naver.html" aria-current="page">네이버</a>
    <a href="sagdam.html">사그담</a>
  </nav>
  <h1>발주 수취인 정리</h1>
  <p class="lead">발주발송관리 엑셀에서 수취인명, 상품명, 옵션정보, 수량을 뽑아 수취인별로 묶어줍니다. 파일은 이 브라우저 안에서만 처리되고 어디로도 전송되지 않습니다.</p>

  <div class="grid">
    <section class="panel" aria-label="파일 입력">
      <div class="field">
        <span class="lbl">엑셀 파일</span>
        <label class="drop" id="drop">
          <input type="file" id="file" accept=".xlsx,.xlsm">
          <span class="name" id="fname">파일을 끌어다 놓거나 눌러서 선택</span>
          <span class="hint" id="fhint">.xlsx, 비밀번호가 걸린 파일도 가능</span>
        </label>
      </div>
      <div class="field">
        <label class="lbl" for="pw">비밀번호</label>
        <input type="password" id="pw" value="1111" autocomplete="off" placeholder="비밀번호가 없으면 비워두세요">
      </div>
      <div class="field">
        <label class="lbl" for="qfmt">수량 표기</label>
        <select id="qfmt">
          <option value="gae">2개</option>
          <option value="num">2</option>
          <option value="x">x2</option>
        </select>
      </div>
      <button class="run" id="run" disabled>정리하기</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" aria-label="결과">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab1" aria-selected="true">1번 수취인·상품</button>
        <button class="tab" role="tab" id="tab2" aria-selected="false">2번 연락처·배송지</button>
      </div>
      <div class="res-head">
        <div class="summary" id="summary"><span class="tag">예시</span><span>파일을 넣으면 이런 모양으로 나옵니다</span></div>
        <button class="ghost" id="copy" disabled>전체 복사</button>
      </div>
      <pre id="out" class="sample">홍길동
샘플 상품 A 옵션: 500g 2개
샘플 상품 B 옵션: 1kg 1개

김영희
샘플 상품 A 옵션: 1kg 1개</pre>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const enc = new TextEncoder();
  const concat = (...a) => {
    let n = 0; for (const x of a) n += x.length;
    const o = new Uint8Array(n); let p = 0;
    for (const x of a) { o.set(x, p); p += x.length; }
    return o;
  };
  const u32le = (n) => new Uint8Array([n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255]);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const utf16le = (s) => { const o = new Uint8Array(s.length * 2); for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); o[2 * i] = c & 255; o[2 * i + 1] = c >> 8; } return o; };
  const HASH = { SHA1: 'SHA-1', SHA256: 'SHA-256', SHA384: 'SHA-384', SHA512: 'SHA-512' };
  const digest = async (alg, d) => new Uint8Array(await crypto.subtle.digest(alg, d));
  const tick = () => new Promise((r) => setTimeout(r, 0));
  const eq = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);

  class UserError extends Error {}

  /* ---------- 암호화된 엑셀(OLE 컨테이너) 읽기 ---------- */
  function readCFB(buf) {
    const sig = [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1];
    if (!sig.every((b, i) => buf[i] === b)) return null;
    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    const ss = 1 << dv.getUint16(0x1E, true);
    const mss = 1 << dv.getUint16(0x20, true);
    const dirStart = dv.getUint32(0x30, true);
    const cutoff = dv.getUint32(0x38, true);
    const mfStart = dv.getUint32(0x3C, true);
    const difStart = dv.getUint32(0x44, true);
    const nDif = dv.getUint32(0x48, true);
    const END = 0xFFFFFFFA;
    const sec = (i) => buf.subarray((i + 1) * ss, (i + 2) * ss);
    const u32s = (bytes) => { const d = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength); const o = []; for (let i = 0; i + 4 <= bytes.length; i += 4) o.push(d.getUint32(i, true)); return o; };

    const fatIds = [];
    for (let i = 0; i < 109; i++) { const v = dv.getUint32(0x4C + i * 4, true); if (v < END) fatIds.push(v); }
    let d = difStart;
    for (let k = 0; k < nDif && d < END; k++) {
      const s = u32s(sec(d));
      for (let i = 0; i < s.length - 1; i++) if (s[i] < END) fatIds.push(s[i]);
      d = s[s.length - 1];
    }
    const fat = [];
    for (const id of fatIds) fat.push(...u32s(sec(id)));
    const chain = (start, table) => { const out = []; let c = start; while (c < END && out.length <= table.length) { out.push(c); c = table[c]; } return out; };
    const readChain = (start) => concat(...chain(start, fat).map(sec));

    const dir = readChain(dirStart);
    const dd = new DataView(dir.buffer, dir.byteOffset, dir.byteLength);
    const entries = [];
    for (let o = 0; o + 128 <= dir.length; o += 128) {
      const nl = dd.getUint16(o + 0x40, true);
      const name = new TextDecoder('utf-16le').decode(dir.subarray(o, o + Math.max(0, nl - 2)));
      entries.push({ name, type: dir[o + 0x42], start: dd.getUint32(o + 0x74, true), size: dd.getUint32(o + 0x78, true) });
    }
    const root = entries.find((e) => e.type === 5);
    const mini = root ? readChain(root.start).subarray(0, root.size) : new Uint8Array(0);
    const miniFat = u32s(readChain(mfStart));
    return {
      stream(name) {
        const e = entries.find((x) => x.name === name && x.type === 2);
        if (!e) return null;
        if (e.size < cutoff) {
          const parts = chain(e.start, miniFat).map((i) => mini.subarray(i * mss, (i + 1) * mss));
          return concat(...parts).subarray(0, e.size);
        }
        return readChain(e.start).subarray(0, e.size);
      }
    };
  }

  // AES-CBC 복호화(패딩 없음). WebCrypto는 PKCS7만 지원하므로 패딩 블록을 하나 덧붙여 우회한다.
  async function aesCbcDec(ck, iv, data) {
    const last = data.subarray(data.length - 16);
    const padBlock = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-CBC', iv: last }, ck, new Uint8Array(0))).subarray(0, 16);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, ck, concat(data, padBlock)));
  }

  async function decryptAgile(info, password, onProgress) {
    const xml = new TextDecoder().decode(info.subarray(8)).replace(/^﻿/, '');
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    const kd = doc.getElementsByTagNameNS('*', 'keyData')[0];
    const ek = doc.getElementsByTagNameNS('*', 'encryptedKey')[0];
    if (!kd || !ek) throw new UserError('지원하지 않는 암호화 방식입니다.');
    const A = (el, n) => el.getAttribute(n);
    const alg = HASH[A(ek, 'hashAlgorithm')];
    if (!alg || A(ek, 'cipherAlgorithm') !== 'AES') throw new UserError('지원하지 않는 암호화 방식입니다.');
    const salt = b64(A(ek, 'saltValue'));
    const spin = +A(ek, 'spinCount');
    const keyLen = +A(ek, 'keyBits') / 8;
    const saltSize = +A(ek, 'saltSize');

    let h = await digest(alg, concat(salt, utf16le(password)));
    for (let i = 0; i < spin; i++) {
      h = await digest(alg, concat(u32le(i), h));
      if (i % 20000 === 0) { onProgress && onProgress(i / spin); await tick(); }
    }
    const derive = async (blockKey) => {
      let k = await digest(alg, concat(h, blockKey));
      if (k.length < keyLen) k = concat(k, new Uint8Array(keyLen - k.length).fill(0x36));
      return crypto.subtle.importKey('raw', k.subarray(0, keyLen), 'AES-CBC', false, ['encrypt', 'decrypt']);
    };
    const hex = (s) => Uint8Array.from(s.match(/../g).map((x) => parseInt(x, 16)));
    const kIn = await derive(hex('fea7d2763b4b9e79'));
    const kVal = await derive(hex('d7aa0f6d3061344e'));
    const kKey = await derive(hex('146e0be7abacd0d6'));
    const vIn = await aesCbcDec(kIn, salt, b64(A(ek, 'encryptedVerifierHashInput')));
    const vVal = await aesCbcDec(kVal, salt, b64(A(ek, 'encryptedVerifierHashValue')));
    const check = await digest(alg, vIn.subarray(0, saltSize));
    if (!eq(check, vVal.subarray(0, check.length))) throw new UserError('비밀번호가 맞지 않습니다. 다시 확인해 주세요.');
    const secret = (await aesCbcDec(kKey, salt, b64(A(ek, 'encryptedKeyValue')))).subarray(0, keyLen);
    return { secret, kdSalt: b64(A(kd, 'saltValue')), kdAlg: HASH[A(kd, 'hashAlgorithm')], blockSize: +A(kd, 'blockSize') };
  }

  async function decryptPackage(cfb, password, onProgress) {
    const info = cfb.stream('EncryptionInfo');
    const pkg = cfb.stream('EncryptedPackage');
    if (!info || !pkg) throw new UserError('엑셀 파일 형식이 아닙니다.');
    const major = info[0] | (info[1] << 8), minor = info[2] | (info[3] << 8);
    if (!(major === 4 && minor === 4)) throw new UserError('지원하지 않는 암호화 방식입니다. (Excel 2010 이상에서 저장한 파일만 가능)');
    const { secret, kdSalt, kdAlg, blockSize } = await decryptAgile(info, password, onProgress);
    const pdv = new DataView(pkg.buffer, pkg.byteOffset, pkg.byteLength);
    const size = pdv.getUint32(0, true) + pdv.getUint32(4, true) * 4294967296;
    const data = pkg.subarray(8);
    const ck = await crypto.subtle.importKey('raw', secret, 'AES-CBC', false, ['encrypt', 'decrypt']);
    const out = [];
    for (let i = 0, off = 0; off < data.length; i++, off += 4096) {
      const seg = data.subarray(off, Math.min(off + 4096, data.length));
      const iv = (await digest(kdAlg, concat(kdSalt, u32le(i)))).subarray(0, blockSize);
      out.push(await aesCbcDec(ck, iv, seg));
    }
    return concat(...out).subarray(0, size);
  }

  /* ---------- xlsx에서 표 읽기 ---------- */
  const NS = '*';
  const colOf = (ref) => ref.replace(/\d+/g, '');
  const tagText = (el) => { let s = ''; for (const t of el.getElementsByTagNameNS(NS, 't')) { if (t.parentNode.localName === 'rPh') continue; s += t.textContent; } return s; };
  const normNum = (v) => (/^-?\d+(\.\d+)?$/.test(v) && Number.isInteger(+v) ? String(+v) : v);

  async function readSheets(bytes) {
    let zip;
    try { zip = await JSZip.loadAsync(bytes); } catch (e) { throw new UserError('엑셀(.xlsx) 파일이 아니거나 손상된 파일입니다.'); }
    const parse = async (path) => { const f = zip.file(path); return f ? new DOMParser().parseFromString(await f.async('string'), 'application/xml') : null; };
    const sstDoc = await parse('xl/sharedStrings.xml');
    const sst = sstDoc ? [...sstDoc.getElementsByTagNameNS(NS, 'si')].map(tagText) : [];

    let sheets = [];
    const wb = await parse('xl/workbook.xml');
    const rels = await parse('xl/_rels/workbook.xml.rels');
    if (wb && rels) {
      const relMap = {};
      for (const r of rels.getElementsByTagNameNS(NS, 'Relationship')) relMap[r.getAttribute('Id')] = r.getAttribute('Target');
      for (const s of wb.getElementsByTagNameNS(NS, 'sheet')) {
        const rid = s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
        let t = relMap[rid]; if (!t) continue;
        t = t.replace(/^\/+/, ''); if (!t.startsWith('xl/')) t = 'xl/' + t;
        sheets.push({ name: s.getAttribute('name'), path: t });
      }
    }
    if (!sheets.length) sheets = [{ name: 'Sheet1', path: 'xl/worksheets/sheet1.xml' }];

    const result = [];
    for (const sh of sheets) {
      const doc = await parse(sh.path); if (!doc) continue;
      const rows = [];
      for (const row of doc.getElementsByTagNameNS(NS, 'row')) {
        const cells = {};
        for (const c of row.getElementsByTagNameNS(NS, 'c')) {
          const t = c.getAttribute('t');
          const vEl = [...c.children].find((x) => x.localName === 'v');
          let v = vEl ? vEl.textContent : '';
          if (t === 's') v = sst[+v] ?? '';
          else if (t === 'inlineStr') { const is = [...c.children].find((x) => x.localName === 'is'); v = is ? tagText(is) : ''; }
          else if (t !== 'str' && t !== 'e' && t !== 'b') v = normNum(v);
          cells[colOf(c.getAttribute('r'))] = v;
        }
        rows.push(cells);
      }
      result.push({ name: sh.name, rows });
    }
    return result;
  }

  const WANT = ['수취인명', '상품명', '옵션정보', '수량'];
  const ALL = WANT.concat(['수취인연락처1', '통합배송지', '배송메세지']);
  function extract(sheets) {
    for (const sh of sheets) {
      const hi = sh.rows.findIndex((r) => Object.values(r).some((v) => String(v).trim() === '수취인명'));
      if (hi < 0) continue;
      const map = {};
      for (const [col, v] of Object.entries(sh.rows[hi])) { const k = String(v).trim(); if (ALL.includes(k) && !(k in map)) map[k] = col; }
      const missing = WANT.filter((k) => !(k in map));
      if (missing.length) throw new UserError('다음 열을 찾지 못했습니다: ' + missing.join(', '));
      const items = [];
      for (const r of sh.rows.slice(hi + 1)) {
        const g = (k) => String(r[map[k]] ?? '').trim();
        const it = { name: g('수취인명'), product: g('상품명'), option: g('옵션정보'), qty: g('수량'), phone: g('수취인연락처1'), addr: g('통합배송지'), msg: g('배송메세지') };
        if (!it.name && !it.product) continue;
        items.push(it);
      }
      return items;
    }
    throw new UserError("'수취인명' 열이 있는 시트를 찾지 못했습니다.");
  }

  function format(items, qfmt, tab) {
    const groups = new Map();
    for (const it of items) { const key = tab === 2 ? [it.name, it.phone, it.addr].join('\u0001') : it.name; if (!groups.has(key)) groups.set(key, []); groups.get(key).push(it); }
    const q = (n) => (qfmt === 'num' ? n : qfmt === 'x' ? 'x' + n : n + '개');
    const blocks = [];
    let total = 0;
    for (const [, list] of groups) {
      const lines = list.map((it) => { total += Number(it.qty) || 0; return [it.product, it.option, q(it.qty)].filter(Boolean).join(' '); });
      const f = list[0];
      const head = tab === 2 ? [[f.name, f.phone].filter(Boolean).join(' '), f.addr, [...new Set(list.map((i) => i.msg).filter(Boolean))].join(' / ')].filter(Boolean).join('\n') : f.name;
      blocks.push(head + '\n' + lines.join('\n'));
    }
    return { text: blocks.join('\n\n'), people: groups.size, orders: items.length, total };
  }

  /* ---------- 화면 ---------- */
  let file = null, items = null, tab = 1;
  const SAMPLES = {
    1: '홍길동\n샘플 상품 A 옵션: 500g 2개\n샘플 상품 B 옵션: 1kg 1개\n\n김영희\n샘플 상품 A 옵션: 1kg 1개',
    2: '홍길동 010-0000-0000\n서울특별시 샘플구 예시로 1 101동 101호\n문 앞에 놓아주세요\n샘플 상품 A 옵션: 500g 2개\n샘플 상품 B 옵션: 1kg 1개\n\n김영희 010-1111-1111\n경기도 샘플시 예시길 2\n샘플 상품 A 옵션: 1kg 1개'
  };
  function showSample() {
    const out = $('out'); out.textContent = SAMPLES[tab]; out.classList.add('sample');
    $('summary').innerHTML = '<span class="tag">예시</span><span>파일을 넣으면 이런 모양으로 나옵니다</span>';
    $('copy').disabled = true;
  }
  const doneMsg = () => !items ? '' : !items.length ? '데이터 행이 없습니다.' : (tab === 2 && items.every((i) => !i.phone && !i.addr)) ? '파일에 수취인연락처1, 통합배송지 열이 없습니다.' : '완료했습니다.';
  const status = (msg, err) => { const s = $('status'); s.textContent = msg || ''; s.classList.toggle('err', !!err); };

  function render() {
    if (!items) { showSample(); return; }
    const r = format(items, $('qfmt').value, tab);
    const out = $('out'); out.textContent = r.text; out.classList.remove('sample');
    $('summary').innerHTML = '<span>수취인 <b>' + r.people + '</b>명</span><span>·</span><span>주문 <b>' + r.orders + '</b>건</span><span>·</span><span>수량 합계 <b>' + r.total + '</b></span>';
    $('copy').disabled = !r.text;
  }

  async function run() {
    if (!file) return;
    $('run').disabled = true; items = null;
    try {
      status('파일을 읽는 중…');
      let bytes = new Uint8Array(await file.arrayBuffer());
      const cfb = readCFB(bytes);
      if (cfb) {
        status('비밀번호 확인 중… (몇 초 걸릴 수 있습니다)');
        await tick();
        bytes = await decryptPackage(cfb, $('pw').value, (p) => status('비밀번호 확인 중… ' + Math.round(p * 100) + '%'));
      }
      status('표를 읽는 중…');
      items = extract(await readSheets(bytes));
      render();
      status(doneMsg(), doneMsg().startsWith('파일에'));
    } catch (e) {
      status(e instanceof UserError ? e.message : '처리 중 오류가 났습니다: ' + (e && e.message ? e.message : e), true);
      $('copy').disabled = true;
    } finally { $('run').disabled = !file; }
  }

  function setFile(f) {
    if (!f) return;
    file = f; $('fname').textContent = f.name; $('fhint').textContent = '다른 파일을 끌어다 놓거나 눌러서 바꾸기';
    $('run').disabled = false; run();
  }
  $('file').addEventListener('change', (e) => setFile(e.target.files[0]));
  const drop = $('drop');
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => setFile(e.dataTransfer.files[0]));
  $('run').addEventListener('click', run);
  $('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
  $('qfmt').addEventListener('change', render);
  [1, 2].forEach((n) => $('tab' + n).addEventListener('click', () => {
    tab = n;
    [1, 2].forEach((m) => $('tab' + m).setAttribute('aria-selected', String(m === n)));
    render();
    if (items) status(doneMsg(), doneMsg().startsWith('파일에'));
  }));

  $('copy').addEventListener('click', async () => {
    const text = $('out').textContent;
    const done = () => { const b = $('copy'); b.textContent = '복사했습니다'; setTimeout(() => (b.textContent = '전체 복사'), 1600); };
    try { await navigator.clipboard.writeText(text); done(); }
    catch (e) {
      const r = document.createRange(); r.selectNodeContents($('out'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      status('자동 복사가 막혀 있습니다. 선택된 글자를 직접 복사해 주세요.');
    }
  });
})();
</script>
